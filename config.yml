dataset:
  name: bird_grayscale
  folder: ../data/CUB_200_2011

latent_size: 128
random_seed: 42
run_comparisons: True
train_body: True

classifier_training:
  epochs: 50
  batch_size: 32
  loss_fun: CE
  lf_model: resnet
  hf_model: resnet
  trained_lf_model: None
  trained_hf_model: None
  
fe_training:
  epochs: 40
  batch_size: 128

  r_range:
    start: 0.0
    stop: 1.0
    num_steps: 100
    scale: linear
    direction: reversed # normal: 0 -> 1, reversed 1 -> 0