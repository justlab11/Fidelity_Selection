dataset:
  name: bird_color
  folder: C:/Users/Justin/Documents/ML_Work/Fidelity_Selection/data/CUB_200_2011/CUB_200_2011

latent_size: 256
random_seed: 42
run_comparisons: False
train_body: True


classifier_training:
  epochs: 200
  batch_size: 64
  loss_fun: CE
  lf_model: resnet
  hf_model: vit
  # hf_only, not the concat default: CustomViT hardcodes a 3-channel
  # pretrained backbone (vit_b_16's conv_proj), so concat's 6-channel
  # LF+HF-stacked input crashes it immediately - confirmed by the existing
  # results/bird_grayscale-vit-vit-42-128/ folder, which crashed at exactly
  # this point (empty models/, no summary.json, log cuts off at the first HF
  # forward pass) using the same default.
  hf_input_mode: hf_only
  trained_lf_model: C:/Users/Justin/Documents/ML_Work/Fidelity_Selection/models/cub_resnet_vit_color_color_lf_model.pt
  trained_hf_model: C:/Users/Justin/Documents/ML_Work/Fidelity_Selection/models/cub_resnet_vit_color_color_hf_model.pt
  # 1e-4, not the 1e-5 default - see config.yml's comment on the same line
  # for the full rationale (SelectiveNet/SAT's fresh heads were badly
  # undertrained at 1e-5; only affects --comparisons_only runs since LF/HF
  # are always loaded from the checkpoints above here, never retrained).
  lr: 1e-4

fe_training:
  # Was 200 - the gate's own epoch_metrics.csv showed val_acc peaking at
  # epoch 0-2 then degrading for the rest of a 200-epoch budget (root cause:
  # the disagreement-oversampling weight was ~72x uncapped here, see
  # disagreement_weight_cap's comment below) - 200 epochs was buying noise,
  # not convergence. Dropped to 40 (matching config.yml) now that the actual
  # cause is fixed via gate_lr/disagreement_weight_cap below - validated via
  # tmp_experiments/epoch40_highlr_sweep's 180-run grid at this exact budget.
  epochs: 40
  batch_size: 128
  reruns: 5
  # See config.yml's comment on these same two fields - identical rationale,
  # validated on both CUB experiments together.
  gate_lr: 5e-4
  disagreement_weight_cap: 5.0

selectivenet_training:
  epochs: 30

sat_training:
  epochs: 100

