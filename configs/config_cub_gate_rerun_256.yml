  # path) couldn't escape.
  trained_lf_model: C:\Users\Justin\Documents\ML_Work\Fidelity_Selection\src\results\bird_grayscale-resnet-resnet-42-256\models\lf_model.pt
  trained_hf_model: C:\Users\Justin\Documents\ML_Work\Fidelity_Selection\src\results\bird_grayscale-resnet-resnet-42-256\models\hf_model.pt

fe_training:
  epochs: 200
  batch_size: 128
