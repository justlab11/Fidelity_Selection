dataset:
  name: crop
  folder: C:/Users/Justin/Documents/ML_Work/Fidelity_Selection/data/crop

latent_size: 256
random_seed: 42
run_comparisons: False
train_body: True # ignored for crop - main.py forces this True since there's no separate head to precompute body outputs for


classifier_training:
  epochs: 20 # train split alone is ~148k precropped chips, so this is plenty of gradient steps
  batch_size: 32
  loss_fun: CE
  hf_input_mode: concat
  lf_model: unet
  hf_model: unet
  trained_lf_model: C:\Users\Justin\Documents\ML_Work\Fidelity_Selection\models\crop_lf_model.pt
  trained_hf_model: C:\Users\Justin\Documents\ML_Work\Fidelity_Selection\models\crop_hf_model.pt
  lr: 1e-4 # UNet trained from scratch (not fine-tuned), so 1e-5 default would barely move it

fe_training:
  epochs: 40
  batch_size: 128
  reruns: 5
  # min_bracket_width (AdaptiveGridSearch-era) retired - this was the dataset
  # that motivated dropping its default from 0.05 to 0.0005, since usage(r)
  # collapses within an r-window of ~0.001 here, narrower than the old
  # default. LogSeededGreedySearch (helpers.py) replaces bisection with
  # log-seeded + gap-based greedy refinement instead, which resolved this
  # same narrow window directly (see the crop smoke test report) - using
  # FESettings' global log_seed_points/refinement_budget/gap_tolerance/
  # wide_bracket_ratio defaults for now. refinement_budget may still need a
  # crop-specific override once its full 5-rerun LogSeededGreedySearch sweep
  # validates whether the default (23) resolves crop's transition as well as
  # the smoke test's budget=15 did, or needs raising further.

