dataset:
  name: mnist
  folder: ./data
  augmentations:
    high_fidelity:
      augmentation: none
      strength: 0
      steps: 0
      schedule: linear

    low_fidelity:
      augmentation: noise
      strength: 0.5
      steps: 5
      schedule: decay

  toy_dataset_parameters:
    radius: 1
    num_dims: 2
    num_samples: 4000
    num_classes: 4
    wrong_class_prob: 0.2

parameters:
  latent_representation_size: 64
  random_seed: 42
  num_reruns: 1

stage1:
  epochs: 200
  save_location: ./stage1
  batch_size: 32
  loss_fun: CE

  early_stop:
    patience: 2
    min_delta: 0

# Removed classifier information from stage1 and stage2

stage2:
  epochs: 200
  save_location: ./stage2
  batch_size: 128

  fe_model:
    type: mlp # options: mlp or svm
    regularization: Optional[float] = Field(None, description="not used if type != svm")
    kernel: Optional[str] = Field(None, description="not used if type != svm")
    
    optimizer:
      lr: 3e-3
      weight_decay: 1e-5

    scheduler:
      gamma: .99

    early_stop:
      patience: 5
      min_delta: 0

  r_range:
    start: 0
    stop: 1
    num_steps: 100
    scale: linear
    direction: reversed # normal: 0 -> 1, reversed 1 -> 0